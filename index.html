<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DoCW Treasure Hunt — Jigsaw</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <header>
    <h1>DoCW <span>Treasure Hunt</span></h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="hint-btn" class="ghost-btn hidden" title="Reveal one piece">👁 2</button>
      <div id="timer">00:00</div>
    </div>
  </header>

  <!-- Start screen -->
  <section id="start-screen" class="overlay">
    <h2>🧩 The Jigsaw Gate</h2>
    <p>The portrait has been shattered.<br/>
       Drag each piece into its place on the template.</p>
    <p class="diff-label">Choose difficulty</p>
    <div class="diff-row">
      <button class="diff-btn selected" data-cols="3" data-rows="4">Easy<br><small>12 pieces</small></button>
      <button class="diff-btn" data-cols="4" data-rows="5">Medium<br><small>20 pieces</small></button>
      <button class="diff-btn" data-cols="5" data-rows="7">Hard<br><small>35 pieces</small></button>
    </div>
    <button id="start-btn">Start Puzzle</button>
  </section>

  <!-- Game area -->
  <main id="game-area"></main>

  <!-- Win screen -->
  <section id="win-screen" class="overlay hidden">
    <h2>🎉 Solved!</h2>
    <p>Your time</p>
    <div id="final-time">00:00</div>
    <button id="again-btn">Play Again</button>
  </section>

  <script src="app.js?v=2"></script>
</body>
</html>
